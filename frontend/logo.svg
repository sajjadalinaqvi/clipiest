<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Primary C Curve Gradient (Violet to Cyan) -->
    <linearGradient id="primaryGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Accent Play / Spark Gradient (Magenta to Orange) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Cyber Lightning Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Icon Container with Rounded Corners -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Inner Ambient Neon Light Glow -->
  <circle cx="200" cy="180" r="130" fill="#7c3aed" opacity="0.18" filter="url(#neonGlow)"/>
  <circle cx="320" cy="320" r="120" fill="#06b6d4" opacity="0.15" filter="url(#neonGlow)"/>

  <!-- The "C" Frame Loop (Stylized Film Strip / Aperture) -->
  <g filter="url(#subtleGlow)">
    <!-- Outer Arc of C -->
    <path d="M 356 128
             C 324 104, 282 92, 236 92
             C 142 92, 76 166, 76 256
             C 76 346, 142 420, 236 420
             C 286 420, 330 404, 362 376
             C 374 366, 370 348, 356 340
             L 332 326
             C 322 320, 310 322, 300 330
             C 278 348, 252 356, 226 356
             C 168 356, 126 312, 126 256
             C 126 200, 168 156, 226 156
             C 256 156, 284 166, 304 184
             C 314 192, 326 194, 336 186
             L 360 168
             C 372 158, 370 140, 356 128 Z"
          fill="url(#primaryGrad)"/>

    <!-- Film Sprocket / Cut Accent Marks along C -->
    <rect x="156" y="112" width="16" height="28" rx="6" fill="#0b0f19" transform="rotate(-35 164 126)"/>
    <rect x="88" y="242" width="28" height="16" rx="6" fill="#0b0f19"/>
    <rect x="156" y="372" width="16" height="28" rx="6" fill="#0b0f19" transform="rotate(35 164 386)"/>
  </g>

  <!-- The Center Dynamic Play-Cut & Lightning Spark -->
  <g filter="url(#neonGlow)">
    <!-- Sharp Play / Cut Triangle (Forward Motion) -->
    <path d="M 230 192
             C 230 180, 244 172, 254 180
             L 358 244
             C 368 250, 368 262, 358 268
             L 254 332
             C 244 340, 230 332, 230 320
             Z"
          fill="url(#accentGrad)"/>

    <!-- Dynamic Cut Slice (The "Clip" Action) across the Play Icon -->
    <path d="M 296 160
             L 260 252
             L 290 252
             L 246 352
             L 278 264
             L 248 264
             Z"
          fill="#ffffff"
          opacity="0.95"/>
  </g>

  <!-- Top Right Viral Spark Star -->
  <g transform="translate(378, 108)">
    <path d="M 0 -24 Q 0 0 24 0 Q 0 0 0 24 Q 0 0 -24 0 Q 0 0 0 -24" fill="url(#sparkGrad)" filter="url(#subtleGlow)"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Bottom Left Mini Star -->
  <g transform="translate(108, 384) scale(0.6)">
    <path d="M 0 -20 Q 0 0 20 0 Q 0 0 0 20 Q 0 0 -20 0 Q 0 0 0 -20" fill="#06b6d4" opacity="0.8"/>
  </g>
</svg>
